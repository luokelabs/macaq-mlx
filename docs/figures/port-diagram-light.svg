<svg xmlns="http://www.w3.org/2000/svg" width="940" height="260" viewBox="0 0 940 260" role="img" aria-label="Default 4-bit: the input vector is multiplied directly by the 4-bit weight. Port: the input vector is first multiplied by the scale p and transformed with a Hadamard matrix, then multiplied by the transformed 4-bit weight; the output is the same.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.t{fill:#1f2328;font-size:14px}.tb{fill:#1f2328;font-size:14.5px;font-weight:600}.s{fill:#656d76;font-size:12px}.m{fill:#454f5b;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}.lab{fill:#454f5b;font-size:12px;font-style:italic}.box{fill:#ffffff;stroke:#454f5b;stroke-width:1.5}.bq4{stroke:#c25b0a;stroke-width:2.5} .bmq{stroke:#a8327f;stroke-width:2.5}.ln{stroke:#454f5b;stroke-width:1.5;fill:none} .hd{fill:#454f5b}.br{stroke:#a8327f;stroke-width:1.5;fill:none}.grid{stroke:#e6eaef;stroke-width:1} .zero{stroke:#454f5b;stroke-width:1.5}.link{stroke:#aab3bd;stroke-width:2} .track{fill:#e6eaef}.q4{fill:#c25b0a} .mq{fill:#a8327f}.dq4{fill:#c25b0a;stroke:#ffffff;stroke-width:2} .dmq{fill:#a8327f;stroke:#ffffff;stroke-width:2}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hd"/></marker></defs>
<text class="tb" x="10" y="56">Default 4-bit</text><text class="s" x="10" y="74">plain 4-bit</text>
<rect class="box " x="150" y="35" width="120" height="50" rx="4"/>
<text class="t" x="210" y="65" text-anchor="middle">input x</text>
<line class="ln" x1="270" y1="60" x2="668" y2="60" marker-end="url(#ah)"/>
<text class="lab" x="470" y="52" text-anchor="middle">multiplied directly</text>
<rect class="box bq4" x="670" y="35" width="130" height="50" rx="4"/>
<text class="t" x="735" y="65" text-anchor="middle">4-bit weight W</text>
<line class="ln" x1="800" y1="60" x2="838" y2="60" marker-end="url(#ah)"/>
<rect class="box " x="840" y="35" width="90" height="50" rx="4"/>
<text class="t" x="885" y="65" text-anchor="middle">output</text>
<path class="br" d="M330,146 V138 H610 V146"/>
<text class="lab" x="470" y="128" text-anchor="middle">two extra steps at run time: about 15% slower generation</text>
<text class="tb" x="10" y="176">Port</text><text class="s" x="10" y="194">transform + GPTQ</text>
<rect class="box " x="150" y="155" width="120" height="50" rx="4"/>
<text class="t" x="210" y="185" text-anchor="middle">input x</text>
<line class="ln" x1="270" y1="180" x2="328" y2="180" marker-end="url(#ah)"/>
<rect class="box bmq" x="330" y="155" width="120" height="50" rx="4"/>
<text class="tb" x="390" y="176" text-anchor="middle">× p</text><text class="s" x="390" y="194" text-anchor="middle">per channel</text>
<line class="ln" x1="450" y1="180" x2="488" y2="180" marker-end="url(#ah)"/>
<rect class="box bmq" x="490" y="155" width="120" height="50" rx="4"/>
<text class="tb" x="550" y="176" text-anchor="middle">Hadamard</text><text class="s" x="550" y="194" text-anchor="middle">blocks of 64</text>
<line class="ln" x1="610" y1="180" x2="668" y2="180" marker-end="url(#ah)"/>
<rect class="box " x="670" y="155" width="130" height="50" rx="4"/>
<text class="t" x="735" y="176" text-anchor="middle">4-bit weight W′</text><text class="m" x="735" y="194" text-anchor="middle">W′ = (W ÷ p)·H</text>
<line class="ln" x1="800" y1="180" x2="838" y2="180" marker-end="url(#ah)"/>
<rect class="box " x="840" y="155" width="90" height="50" rx="4"/>
<text class="t" x="885" y="176" text-anchor="middle">output</text><text class="s" x="885" y="194" text-anchor="middle">unchanged</text>
<text class="s" x="735" y="232" text-anchor="middle">W′ is computed first, then quantized with GPTQ</text>
</svg>
