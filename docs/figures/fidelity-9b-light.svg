<svg xmlns="http://www.w3.org/2000/svg" width="820" height="286" viewBox="0 0 820 286" role="img" aria-label="Qwen3.5-9B: mean KL default 4-bit 0.094, port 0.040; perplexity increase 9.5% and 3.8%; same top-1 token 86.1% and 91.2%.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.t{fill:#1f2328;font-size:14px}.tb{fill:#1f2328;font-size:14.5px;font-weight:600}.s{fill:#656d76;font-size:12px}.m{fill:#454f5b;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}.lab{fill:#454f5b;font-size:12px;font-style:italic}.box{fill:#ffffff;stroke:#454f5b;stroke-width:1.5}.bq4{stroke:#c25b0a;stroke-width:2.5} .bmq{stroke:#a8327f;stroke-width:2.5}.ln{stroke:#454f5b;stroke-width:1.5;fill:none} .hd{fill:#454f5b}.br{stroke:#a8327f;stroke-width:1.5;fill:none}.grid{stroke:#e6eaef;stroke-width:1} .zero{stroke:#454f5b;stroke-width:1.5}.link{stroke:#aab3bd;stroke-width:2} .track{fill:#e6eaef}.q4{fill:#c25b0a} .mq{fill:#a8327f}.dq4{fill:#c25b0a;stroke:#ffffff;stroke-width:2} .dmq{fill:#a8327f;stroke:#ffffff;stroke-width:2}</style>
<text class="tb" x="10" y="22">Mean KL divergence</text><text class="s" x="153" y="22">lower is closer to the original</text>
